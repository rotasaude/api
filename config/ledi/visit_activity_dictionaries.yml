# Dicionários e regras da ficha de Visita Domiciliar e Territorial (FVD,
# tipoDadoSerializado 8) e da ficha de Atividade Coletiva (FAC, 6) do LEDI APS
# 8.7.0 — módulo 24b (ADR 0052; Task 1, prova técnica). Fonte:
# vendor/ledi/8.7.0/docs/dicionario-fvd.html e dicionario-fac.html (baixados em
# 2026-11-12; SHA-256 abaixo e em vendor/ledi/8.7.0/SOURCE), com as tabelas de
# código de dicionario.html, conferidos contra o IDL e o gen-rb vendorizados
# (spec/services/ledi/visit_activity_dictionaries_spec.rb). Quando o dicionário
# e o IDL divergem no nome ou na ordem do campo, vale o IDL (`ledi`).
#
# Códigos LEDI inteiros; rótulos verbatim do dicionário. O api decide
# (HomeVisits::Rules, CollectiveActivities::Rules); daqui saem o
# `context.domains`/`options.domains` (contrato §7) e o domains-v1.json do
# rotasaude/contracts (escrito pela sessão do contracts, Q13).
version: "8.7.0"
source:
  fvd: e4057a7a27e104ae155a931ecd98260f7b84215421e705b81c5cd3f64f969e7c
  fac: b4dcd22fed0161528072493f02a6039cfca4a63df394ef40747157ba1c43013b

home_visit:
  domains:
    # MotivoVisita (dicionario.html); o grupo é a coluna Observações (#GRUPO na
    # primeira linha de cada um). 21 e 30 têm o mesmo rótulo; a tela mostra o grupo.
    motivo_visita:
      1: { label: "Cadastramento / Atualização", group: TIPO_VISITA }
      29: { label: "Visita periódica", group: TIPO_VISITA }
      2: { label: "Consulta", group: BUSCA_ATIVA }
      3: { label: "Exame", group: BUSCA_ATIVA }
      4: { label: "Vacina", group: BUSCA_ATIVA }
      30: { label: "Condicionalidades do bolsa família", group: BUSCA_ATIVA }
      5: { label: "Gestante", group: ACOMPANHAMENTO }
      6: { label: "Puérpera", group: ACOMPANHAMENTO }
      7: { label: "Recém-nascido", group: ACOMPANHAMENTO }
      8: { label: "Criança", group: ACOMPANHAMENTO }
      9: { label: "Pessoa com desnutrição", group: ACOMPANHAMENTO }
      10: { label: "Pessoa em reabilitação ou com deficiência", group: ACOMPANHAMENTO }
      11: { label: "Pessoa com hipertensão", group: ACOMPANHAMENTO }
      12: { label: "Pessoa com diabetes", group: ACOMPANHAMENTO }
      13: { label: "Pessoa com asma", group: ACOMPANHAMENTO }
      14: { label: "Pessoa com DPOC / enfisema", group: ACOMPANHAMENTO }
      15: { label: "Pessoa com câncer", group: ACOMPANHAMENTO }
      16: { label: "Pessoa com outras doenças crônicas", group: ACOMPANHAMENTO }
      17: { label: "Pessoa com hanseníase", group: ACOMPANHAMENTO }
      18: { label: "Pessoa com tuberculose", group: ACOMPANHAMENTO }
      32: { label: "Sintomáticos respiratórios", group: ACOMPANHAMENTO }
      33: { label: "Tabagista", group: ACOMPANHAMENTO }
      19: { label: "Domiciliados / Acamados", group: ACOMPANHAMENTO }
      20: { label: "Condições de vulnerabilidade social", group: ACOMPANHAMENTO }
      21: { label: "Condicionalidades do bolsa família", group: ACOMPANHAMENTO }
      22: { label: "Saúde mental", group: ACOMPANHAMENTO }
      23: { label: "Usuário de álcool", group: ACOMPANHAMENTO }
      24: { label: "Usuário de outras drogas", group: ACOMPANHAMENTO }
      38: { label: "Pessoa idosa", group: ACOMPANHAMENTO }
      34: { label: "Ação educativa", group: CONTROLE_AMBIENTAL_E_VETORIAL }
      35: { label: "Imóvel com foco", group: CONTROLE_AMBIENTAL_E_VETORIAL }
      36: { label: "Ação mecânica", group: CONTROLE_AMBIENTAL_E_VETORIAL }
      37: { label: "Tratamento focal", group: CONTROLE_AMBIENTAL_E_VETORIAL }
      25: { label: "Egresso de internação", group: OUTROS }
      27: { label: "Convite para atividades coletivas / campanha de saúde", group: OUTROS }
      31: { label: "Orientação / Prevenção", group: OUTROS }
      28: { label: "Outros", group: OUTROS }
    # Rótulo do grupo: o dicionário só tem o marcador (#TIPO_VISITA…); estes são da tela.
    motivo_visita_groups:
      TIPO_VISITA: { group_label: "Tipo de visita" }
      BUSCA_ATIVA: { group_label: "Busca ativa" }
      ACOMPANHAMENTO: { group_label: "Acompanhamento" }
      CONTROLE_AMBIENTAL_E_VETORIAL: { group_label: "Controle ambiental e vetorial" }
      OUTROS: { group_label: "Outros" }
    desfecho:  # Desfecho
      1: "Visita realizada"
      2: "Visita recusada"
      3: "Ausente"
    turno:  # Turno (o mesmo da FAC)
      1: "Manhã"
      2: "Tarde"
      3: "Noite"
    # tipoGlicemia (IDL 18, i64) → "Referência: TipoGlicemiaCapilar" no dicionario-fvd.html.
    tipo_glicemia:  # tipoGlicemiaCapilar
      0: "Jejum"
      1: "Pós-prandial"
      2: "Pré-prandial"
      3: "Não especificado"
    # Os mesmos domínios do 24a (config/ledi/registration_dictionaries.yml), em texto no
    # dashboard e no app (Q26): tipoDeImovel e JustificativaNaoPossuiCpf.
    tipo_de_imovel: territory
    justificativa_nao_possui_cpf: territory

  # Medidas (todas opcionais). Faixas e casas: "Valor mínimo … e máximo …" / "só aceita
  # valores entre … e …" e "Máximo de N casa(s) decimal(is)" de cada campo do
  # dicionario-fvd.html. Todas proibidas com desfecho 2/3 e em imóvel não residencial.
  measurements:
    weight_kg: { ledi: pesoAcompanhamentoNutricional, min: 0.5, max: 500, decimals: 3 }
    height_cm: { ledi: alturaAcompanhamentoNutricional, min: 20, max: 250, decimals: 1 }
    systolic: { ledi: pressaoSistolica, min: 0, max: 999, decimals: 0, requires: diastolic }
    diastolic: { ledi: pressaoDiastolica, min: 0, max: 999, decimals: 0, requires: systolic }
    temperature_c: { ledi: temperatura, min: 20, max: 45, decimals: 1 }
    glucose_mg_dl: { ledi: glicemia, min: 0, max: 800, decimals: 0, requires: glucose_type }
    glucose_type: { ledi: tipoGlicemia, domain: tipo_glicemia, requires: glucose_mg_dl }

  rules:
    # tipoDeImovel 02, 03, 04, 05, 06, 12, 13: sem numProntuario, CNS, CPF, nascimento,
    # sexo e medidas; motivos só da lista abaixo (motivosVisita).
    non_residential_property_types: ["2", "3", "4", "5", "6", "12", "13"]
    non_residential_reasons: [1, 34, 35, 36, 37, 27, 31, 28]
    # "As opções 5 (Gestante) e 6 (Puérpera) não podem ser informadas se o Sexo = 0
    # (masculino)": proibidas só para o masculino (não para feminino, ignorado ou sem sexo).
    male_forbidden_reasons: [5, 6]
    # motivosVisita e todas as medidas: "Não deve ser preenchido caso o campo desfecho =
    # 3 Ausente ou 2 Visita Recusada".
    outcomes_without_reasons_and_measurements: [2, 3]
    reasons_max: 36            # motivosVisita: List<Long>, máximo 36
    visits_per_sheet: 99       # visitasDomiciliares: List, máximo 99
    # cnsCidadao não é obrigatório em nenhuma condição; o marcador sem CPF só exige a
    # justificativa (justificativaNaoPossuiCpf "É obrigatório se stCidadaoNaoPossuiCpf=true").
    cns_required_with_no_cpf: false
    # dtNascimento e sexo: nunca em não residencial; em residencial, obrigatórios se houver
    # CNS, o outro dos dois, motivo de #BUSCA_ATIVA ou #ACOMPANHAMENTO, motivo 25 ou 31, ou
    # peso/altura. Com pessoa o api manda os dois sempre; sem pessoa (subject none) nenhum
    # desses gatilhos pode vir (as duas listas abaixo).
    birth_and_sex_required: with_person
    without_person_allowed_reasons: [1, 29, 34, 35, 36, 37, 27, 28]
    without_person_forbidden_measurements: [weight_kg, height_cm]

