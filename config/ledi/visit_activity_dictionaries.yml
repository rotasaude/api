  rules:
    # Contrato §4/§7 (Ruling A1): tipo → campo → required | forbidden | optional, lido dos
    # campos temasParaReuniao (#8), publicoAlvo (#9), temasParaSaude (#16), praticasEmSaude
    # (#17) e participantes (#10) do dicionario-fac.html. health_topics nos tipos 1–3 é
    # forbidden SALVO com o tema de reunião health_topics_meeting_exception (6, Educação
    # permanente) na lista: aí é opcional ("Não pode ser preenchido se atividadeTipo = 1, 2
    # ou 3 e temasParaReuniao diferente de Educação permanente"). No domains-v1.json do
    # contracts, o mesmo dado é o valor "with_meeting_topic_6".
    by_activity_type:
      1: { meeting_topics: required, target_audience: forbidden, health_topics: forbidden, health_practices: forbidden, participants: optional }
      2: { meeting_topics: required, target_audience: forbidden, health_topics: forbidden, health_practices: forbidden, participants: optional }
      3: { meeting_topics: required, target_audience: forbidden, health_topics: forbidden, health_practices: forbidden, participants: optional }
      4: { meeting_topics: forbidden, target_audience: required, health_topics: required, health_practices: forbidden, participants: optional }
      5: { meeting_topics: forbidden, target_audience: required, health_topics: required, health_practices: optional, participants: required }
      6: { meeting_topics: forbidden, target_audience: required, health_topics: optional, health_practices: required, participants: required }
      7: { meeting_topics: forbidden, target_audience: required, health_topics: required, health_practices: forbidden, participants: optional }
    health_topics_meeting_exception: 6
    # "Os itens 2, 9 e 33 só podem ser utilizados se atividadeTipo = 6".
    type6_only_practices: [2, 9, 33]
    # procedimento: "Só pode ser preenchido se o campo praticasEmSaude possuir o valor 30";
    # referência OutroProcedimentoColetivo (domains.outro_procedimento_coletivo).
    procedure_practice: 30
    # cessouHabitoFumar e abandonouGrupo: "Não deve ser preenchido se o campo praticasEmSaude
    # for diferente de 25, 26, 27 ou 28 (referentes ao PNCT)" — a 34 (manutenção) não entra.
    smoking_practices: [25, 26, 27, 28]
    # 18 (Semana saúde na escola) exige pseEducacao ou pseSaude: nunca aceito (PSE fora).
    forbidden_health_topics: [18]
    others_target_audience: 18
    # cpfParticipante / cnsParticipante obrigatórios nos tipos 5 e 6 (CPF; sem CPF, o CNS com
    # stCidadaoNaoPossuiCpf = true); dataNascimento e sexo obrigatórios em todo participante.
    participant_identifier_types: [5, 6]
    # Tamanho máximo das listas (coluna Máximo de cada List<Long>).
    list_max: { meeting_topics: 7, target_audience: 17, health_topics: 16, health_practices: 14 }
    participants_count: { min: 1, max: 999 }   # numParticipantes; ≥ participantes listados
    altered_count: { min: 0, max: 999 }        # numAvaliacoesAlteradas; = participantes com avaliacaoAlterada
