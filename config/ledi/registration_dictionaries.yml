sections:
  identification:
    # As regras de validação de um nome estão descritas em Validar nome; Não deve ser preenchido se o campo desconheceNomePai = true. Caso contrário, o preenchimento é obrigatório.
    nome_pai_cidadao: { ledi: nomePaiCidadao, type: name, max: 70, min: 3 }
    desconhece_nome_pai: { ledi: desconheceNomePai, type: bool }
    desconhece_nome_mae: { ledi: desconheceNomeMae, type: bool }
    nacionalidade_cidadao: { ledi: nacionalidadeCidadao, type: code, domain: nacionalidade, required: true }
    # Só pode ser preenchido se o campo nacionalidadeCidadao = 1 (Brasileiro). Neste caso é de preenchimento obrigatório.
    codigo_ibge_municipio_nascimento: { ledi: codigoIbgeMunicipioNascimento, type: digits, max: 7, min: 7 }
    # Só pode ser preenchido se o campo nacionalidadeCidadao = 3 (Estrangeiro). Neste caso o preenchimento é obrigatório; Se o campo nacionalidadeCidadao for igual a 1 (Brasileira), este campo deve ser preenchido com 31 (BRASIL).
    pais_nascimento: { ledi: paisNascimento, type: code, domain: pais }
    # Só deve ser preenchido se o campo nacionalidadeCidadao = 2. Neste caso, é de preenchimento obrigatório; Não pode ser posterior a dataAtendimento; Não pode ser anterior a dataNascimentoCidadao.
    dt_naturalizacao: { ledi: dtNaturalizacao, type: date }
    # Só deve ser preenchido se o campo nacionalidadeCidadao = 2. Neste caso o preenchimento é obrigatório.
    portaria_naturalizacao: { ledi: portariaNaturalizacao, type: text, max: 16 }
    # Só deve ser preenchido se o campo nacionalidadeCidadao = 3. Neste caso o preenchimento é obrigatório; Não pode ser posterior a dataAtendimento; Não pode ser anterior a dataNascimentoCidadao.
    dt_entrada_brasil: { ledi: dtEntradaBrasil, type: date }
    # Apenas números; O preenchimento do campo é obrigatório apenas se o campo nacionalidadeCidadao estiver preenchido como "brasileira" ou "naturalizado".
    telefone_celular: { ledi: telefoneCelular, type: digits, max: 11, min: 10 }
    # Requerido seguir o padrão endereco@domínio.extensao.
    email_cidadao: { ledi: emailCidadao, type: text, max: 100, min: 6 }
    # Apenas números.
    numero_nis_pis_pasep: { ledi: numeroNisPisPasep, type: digits, max: 11, min: 11 }
    estado_civil: { ledi: estadoCivil, type: code, domain: estado_civil }
    tipo_sanguineo: { ledi: tipoSanguineo, type: code, domain: tipo_sanguineo }
    dnv: { ledi: dnv, type: text, max: 15, min: 11 }
  sociodemographic:
    # Requerido preenchimento de pelo menos um item se o campo statusTemAlgumaDeficiencia = true; Não deve ser preenchido se o campo statusTemAlgumaDeficiencia = false.
    deficiencias_cidadao: { ledi: deficienciasCidadao, type: codes, domain: deficiencia_cidadao, max_items: 6 }
    grau_instrucao_cidadao: { ledi: grauInstrucaoCidadao, type: code, domain: curso_mais_elevado }
    # Deve ser um código de CBO válido.
    ocupacao_codigo_cbo2002: { ledi: ocupacaoCodigoCbo2002, type: text, max: 6, min: 6 }
    # Não pode ser preenchido se o campo statusDesejaInformarOrientacaoSexual = false; É de preenchimento obrigatório se o campo statusDesejaInformarOrientacaoSexual = true.
    orientacao_sexual_cidadao: { ledi: orientacaoSexualCidadao, type: code, domain: orientacao_sexual }
    # Só pode ser preenchido se o campo statusEhResponsavel = false.
    relacao_parentesco_cidadao: { ledi: relacaoParentescoCidadao, type: code, domain: relacao_parentesco }
    situacao_mercado_trabalho_cidadao: { ledi: situacaoMercadoTrabalhoCidadao, type: code, domain: situacao_mercado_trabalho }
    status_deseja_informar_orientacao_sexual: { ledi: statusDesejaInformarOrientacaoSexual, type: bool, required: true }
    status_frequenta_benzedeira: { ledi: statusFrequentaBenzedeira, type: bool }
    status_frequenta_escola: { ledi: statusFrequentaEscola, type: bool }
    status_membro_povo_comunidade_tradicional: { ledi: statusMembroPovoComunidadeTradicional, type: bool }
    status_participa_grupo_comunitario: { ledi: statusParticipaGrupoComunitario, type: bool }
    status_possui_plano_saude_privado: { ledi: statusPossuiPlanoSaudePrivado, type: bool }
    status_tem_alguma_deficiencia: { ledi: statusTemAlgumaDeficiencia, type: bool }
    # Não pode ser preenchido se o campo statusDesejaInformarIdentidadeGenero = false; É de preenchimento obrigatório se o campo statusDesejaInformarIdentidadeGenero = true.
    identidade_genero_cidadao: { ledi: identidadeGeneroCidadao, type: code, domain: identidade_genero_cidadao }
    status_deseja_informar_identidade_genero: { ledi: statusDesejaInformarIdentidadeGenero, type: bool, required: true }
    # Não pode ser preenchido se a dataNascimentoCidadao for maior ou igual a 10 anos a partir da dataAtendimento.
    responsavel_por_crianca: { ledi: responsavelPorCrianca, type: codes, domain: responsavel_crianca, max_items: 6 }
    # Não deve ser preenchido se o campo statusMembroPovoComunidadeTradicional = false.
    co_povo_comunidade_tradicional: { ledi: coPovoComunidadeTradicional, type: code, domain: povo_comunidade_tradicional }
    # Só pode ser preenchido se o campo comeuAlgunsAlimentosQueTinhaDinheiroAcabou for preenchido. Neste caso o preenchimento é obrigatório; Não deve ser preenchido se o campo statusTermoRecusaCadastroIndividualAtencaoBasica = true.
    alimentos_acabaram_antes_ter_dinheiro_comprar_mais: { ledi: alimentosAcabaramAntesTerDinheiroComprarMais, type: bool }
    # Só pode ser preenchido se o campo alimentosAcabaramAntesTerDinheiroComprarMais for preenchido. Neste caso o preenchimento é obrigatório; Não deve ser preenchido se o campo statusTermoRecusaCadastroIndividualAtencaoBasica = true.
    comeu_alguns_alimentos_que_tinha_dinheiro_acabou: { ledi: comeuAlgunsAlimentosQueTinhaDinheiroAcabou, type: bool }
  health_conditions:
    # Não deve ser preenchido se o campo statusTeveInternadoem12Meses = false.
    descricao_causa_internacao_em12_meses: { ledi: descricaoCausaInternacaoEm12Meses, type: text, max: 100 }
    descricao_outra_condicao1: { ledi: descricaoOutraCondicao1, type: text, max: 100 }
    descricao_outra_condicao2: { ledi: descricaoOutraCondicao2, type: text, max: 100 }
    descricao_outra_condicao3: { ledi: descricaoOutraCondicao3, type: text, max: 100 }
    # Não deve ser preenchido se o campo statusUsaPlantasMedicinais = false.
    descricao_plantas_medicinais_usadas: { ledi: descricaoPlantasMedicinaisUsadas, type: text, max: 100 }
    # Requerido preenchimento de pelo menos um item se o campo statusTeveDoencaCardiaca = true; Não deve ser preenchido se o campo statusTeveDoencaCardiaca = false.
    doenca_cardiaca: { ledi: doencaCardiaca, type: codes, domain: doenca_cardiaca, max_items: 3 }
    # Requerido preenchimento de pelo menos um item se o campo statusTemDoencaRespiratoria = true; Não deve ser preenchido o campo statusTemDoencaRespiratoria = false.
