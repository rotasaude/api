# Lista Nacional de Notificação Compulsória — carga inicial da plataforma (módulo 25, Task 0).
# Lida por Surveillance::DiseaseList::Load. Uma entrada por doença; `sources` em toda linha.
#
# Regras (plano 25, "Leitura preliminar" e "Desvios e precisões"):
# - Os 66 itens do Anexo I da Portaria 11.211/2026 estão aqui: cada um como doença própria ou, quando
#   divide a ficha e o CID com outro item, nas `notes` da doença que o cobre (sources.deadline diz o item).
# - Prazo: o da forma "casos"; forma imediata com CID própria vira doença própria; sem CID própria, vai
#   para `notes` (a vigilância notifica à mão).
# - CID-10 sem ponto. 4 caracteres casa exato; 3 caracteres casa a categoria. Nenhum código cobre outro
#   entre doenças. `cid10: []` = sem CID que identifique só esta doença nas fontes: só notificação manual.
# - CIAP-2 só quando o código da CIAP-2 (edição brasileira, SBMFC 2009, com a tabela de CID-10 de cada
#   rubrica) corresponde a uma única doença desta lista.
# - repeat_after_days: proposta do plano 25 (a portaria não fixa) — confirmar com a vigilância.
#
# Fontes (arquivos em vendor/surveillance/2026-10-27/, URLs e SHA-256 em SOURCE):
#   prt11211.html (Portaria GM/MS 11.211/2026), fichas de investigação do Sinan (<sinan_form>.pdf),
#   notificacao_conclusao.pdf, gvs_6ed_v{1,2,3}.pdf (Guia de Vigilância em Saúde, 6ª ed., MS 2023),
#   nt117_2024_oropouche.pdf (NT 117/2024-CGARB/DEDT/SVSA/MS), cid10_datasus_csv.zip (tabela CID-10 do
#   DATASUS), ciap2_sbmfc.pdf (CIAP-2, 2ª ed., SBMFC 2009).
