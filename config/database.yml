    <<: *default
    database: rota_saude_test
    username: rota_app
    password: <%= ENV.fetch("ROTA_APP_PASSWORD", "rota_app") %>
    host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  platform:
    <<: *default
    database: rota_saude_platform_test
    username: rota_platform
    password: <%= ENV.fetch("ROTA_PLATFORM_PASSWORD", "rota_platform") %>
    host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    migrations_paths: db/platform_migrate
    schema_dump: platform_schema.rb
  # Destino do shard `bootstrap` do CityRecord. Aponta DE PROPÓSITO para um
  # banco que EXISTE (criado vazio por city:test_databases) mas não tem
  # NENHUMA tabela: qualquer query de domínio fora de CityConnection.with
  # levanta ActiveRecord::StatementInvalid (PG::UndefinedTable) em vez de
  # cair no banco compartilhado. Um banco realmente inexistente também fecha
  # esse shard, mas derruba a suíte inteira: RSpec's
  # setup_transactional_fixtures pina/verifica todo pool registrado antes de
  # cada exemplo, inclusive este, e não é preguiçoso como o boot do Rails é
  # (verificado em 2026-09-12).
  city_unset:
    <<: *default
    database: rota_saude_no_city_selected
    username: rota_app
    password: <%= ENV.fetch("ROTA_APP_PASSWORD", "rota_app") %>
