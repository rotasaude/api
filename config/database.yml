default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  prepared_statements: true
  variables:
    statement_timeout: 15s

# queue/cache abaixo conectam como rota_admin até o Plano 5 (fila/cache por
# cidade). O config `admin:` de ApplicationRecord saiu no corte do Plano 2
# (Task 5): o domínio não usa RLS — cada cidade tem o próprio banco, acessado
# por conexão de cidade (ver CityRecord/CityConnection).
development:
  primary:
    <<: *default
    database: rota_saude_development
    username: rota_app
    password: <%= ENV.fetch("ROTA_APP_PASSWORD", "rota_app") %>
    host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  queue:
    <<: *default
    database: rota_saude_development
    username: rota_admin
    password: <%= ENV.fetch("ROTA_ADMIN_PASSWORD", "rota_admin") %>
    host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
  cache:
    <<: *default
    database: rota_saude_development
    username: rota_admin
    password: <%= ENV.fetch("ROTA_ADMIN_PASSWORD", "rota_admin") %>
    host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    migrations_paths: db/cache_migrate
    schema_dump: cache_schema.rb
  # Banco de plataforma — catálogo de cidades, roteamento e contas de operador.
  # NUNCA guarda dado de cidadão. Ver spec 2026-09-12-banco-por-cidade-design.
  platform:
    <<: *default
    database: rota_saude_platform_development
    username: rota_platform
    password: <%= ENV.fetch("ROTA_PLATFORM_PASSWORD", "rota_platform") %>
    host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    migrations_paths: db/platform_migrate
    schema_dump: platform_schema.rb
  # Destino do shard `bootstrap` do CityRecord. Aponta DE PROPÓSITO para um
  # banco que EXISTE (criado vazio por city:test_databases) mas não tem
  # NENHUMA tabela: qualquer query de domínio fora de CityConnection.with
  # levanta ActiveRecord::StatementInvalid (PG::UndefinedTable) em vez de
  # cair no banco compartilhado. Um banco realmente inexistente também fecha
  # esse shard, mas derruba a suíte inteira: RSpec's
  # setup_transactional_fixtures pina/verifica todo pool registrado antes de
  # cada exemplo, inclusive este, e não é preguiçoso como o boot do Rails é
  # (verificado em 2026-09-12).
  city_unset:
    <<: *default
    database: rota_saude_no_city_selected
    username: rota_app
    password: <%= ENV.fetch("ROTA_APP_PASSWORD", "rota_app") %>
    host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    database_tasks: false

