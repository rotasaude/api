# Módulo 28 (ADR 0046; Desvio 5; contrato §16 O21): efeito de cada SIGTAP no
# odontograma. locations: o local do efeito (o mesmo da lista de local e
# quantidade da FAO, config/ledi/dental_procedure_limits.yml: Dente → tooth e
# face, Arcada → arch). effects: part (crown, root ou arch — arch vira um
# evento de coroa por dente da arcada), situation, on_face (na face quando o
# local é face, senão na coroa) e only_on (só nos dentes cuja coroa está numa
# dessas situações; exige o odontograma). Procedimento fora da tabela gera
# evento só com o procedure_code. Nomes: SIGTAP 06/2026 (dicionário FAO); a
# release SIGTAP do dev é uma semente sem procedimento odontológico (conferido
# em 2026-10-30, só leitura).
version: 1
procedures:
