# Módulo 28 (ADR 0046; spec decisão 12; contrato §10 e §16 O15/O24): metas
# mensais de produção do CEO por tipo (I, II, III) e especialidade, com as
# regras de composição e de suspensão. Fonte: Portaria GM/MS 1.464/2011
# (Anexo XL da Portaria de Consolidação 6/2017) e NT 32/2026.
#
# GATE DE GO-LIVE (contrato §16 O15): os códigos com `source: successor` são os
# sucessores de restauração da SIGTAP 06/2026 (0307010074..0307010139), que
# substituem 0307010023/0307010031/0307010040. Entraram por inferência (D11) e
# só valem depois da confirmação da coordenação de saúde bucal; sem ela, tire
# as linhas `successor` dos grupos e da composição.
#
# Chaves: as dos grupos e das regras de composição saem no JSON (O24).
version: 1
source: "Portaria GM/MS 1.464/2011 (Anexo XL da PC 6/2017); NT 32/2026"
goals:
  basic:        { I: 80, II: 110, III: 190, source: "Portaria 1.464/2011 (Anexo XL da PC 6/2017): procedimentos básicos" }
  periodontics: { I: 60, II: 90, III: 150, source: "Portaria 1.464/2011 (Anexo XL da PC 6/2017): periodontia especializada" }
  endodontics:  { I: 35, II: 60, III: 95, source: "Portaria 1.464/2011 (Anexo XL da PC 6/2017): endodontia" }
  oral_surgery: { I: 80, II: 90, III: 170, source: "Portaria 1.464/2011 (Anexo XL da PC 6/2017): cirurgia oral" }
# Procedimento básico só conta de paciente com necessidades especiais.
