# Composição: a parcela dos `codes` no total do grupo, em percentual.
composition:
  basic:
    rule: restorations_min_50
    min_percent: 50
    source: "Portaria 1.464/2011: no mínimo 50% de restaurações nos procedimentos básicos"
    codes:
      - { code: "0307010023", source: "Portaria 1.464/2011" }
      - { code: "0307010031", source: "Portaria 1.464/2011" }
      - { code: "0307010040", source: "Portaria 1.464/2011" }
      # Gate de go-live (O15): sucessores de restauração.
      - { code: "0307010074", source: successor }
      - { code: "0307010082", source: successor }
      - { code: "0307010090", source: successor }
      - { code: "0307010104", source: successor }
      - { code: "0307010112", source: successor }
      - { code: "0307010120", source: successor }
      - { code: "0307010139", source: successor }
  endodontics:
    rule: three_roots_min_20
    min_percent: 20
    source: "Portaria 1.464/2011: no mínimo 20% em dentes permanentes com três ou mais raízes"
    codes:
      - { code: "0307020053", source: "Portaria 1.464/2011" }
      - { code: "0307020096", source: "Portaria 1.464/2011" }
# Alerta: meta não atingida em 2 meses seguidos ou em 3 alternados em 12.
suspension: { consecutive: 2, alternate: 3, window_months: 12, source: "Portaria 1.464/2011 (Anexo XL da PC 6/2017): suspensão do incentivo" }
