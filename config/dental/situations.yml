# Módulo 28 (ADR 0046; Desvio 4; contrato §16 O3): situações do odontograma do
# PEC. part: crown (21), root (6) ou arch (1); abbr: a sigla da figura (nula
# onde a figura usa só o desenho); deciduous: vale em dente decíduo; face: vale
# numa face (M, D, O, V, L); teeth: só nesses dentes (ausente = todos).
# DentalCare::Situations lê daqui; as opções da consulta também.
version: 1
