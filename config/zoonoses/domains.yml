# Módulo 35b: códigos e rótulos dos domínios do centro de zoonoses. Os da lista
# do app são os de field-sync/domains-v1.json → zoonoses (contracts v1.4.0),
# verbatim; os subtipos são os do contrato §4.
# Os do canil (entrada, saída, motivo de eutanásia, base legal) são os do
# contrato §7 e da decisão 20 da spec, com os rótulos fixados pelo
# coordenador onde nenhum dos dois tinha texto (Task 8).
# Os desfechos da demanda (`demand_outcomes`) seguem o Catalog, com os rótulos
# fixados pelo coordenador. Os motivos de remoção da coleira (Task 14) são
# os do contrato §6 (`removal_reasons`, rótulos fixados pelo coordenador). O
# ELISA e a decisão do desfecho (Task 13) com os rótulos do contrato §6.
