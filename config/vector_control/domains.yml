# Módulo 35a: códigos e rótulos dos domínios do controle vetorial, na ordem de
# VectorControl::Catalog. Os rótulos são os do contracts
# (field-sync/domains-v1.json → vector_control.<lista>), verbatim; o
# domains_spec do api compara os dois. Risco: contrato §2 (DN-2025, 5.3).
# Grupos de depósito: manual do LIRAa de 2013, 4.6.1, e DN-2025, 5.2.2.
# Métodos: DN-2009, 5.3. Fontes em config/vector_control/sources.yml.
