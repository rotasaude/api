# REGRA (Q25): antes de mudar qualquer padrão de fábrica deste arquivo, grave
# em CADA cidade que tem levantamento LIRAa sorteado na versão 0
# (liraa_surveys.parameters_version = 0) a versão 1 dos parâmetros com os
# valores ANTIGOS. A versão 0 não é gravada: ela lê este arquivo, e o índice
# desses levantamentos (iip_bands) mudaria junto com ele.
# Módulo 35a (contrato §11): padrão de fábrica dos parâmetros técnicos do
# controle vetorial. A coordenação edita por versão (vector_parameter_versions);
# este arquivo é só o ponto de partida. As faixas do LIRAa e do IIP foram
# conferidas na Task 1 (config/vector_control/sources.yml); divergência das
# fontes volta como Q ao coordenador e não muda estes valores sozinha.
default_days: 60
strategic_point_days: 15
block_radius_rings: 1
block_grouping_days: 7
block_diseases: [dengue, chikungunya, zika]
ubv_cycles_max: 3
ubv_cycle_days_min: 3
ubv_cycle_days_max: 5
ubv_cycle_interval_days: 5
ovitrap_collection_days_min: 3
ovitrap_collection_days_max: 10
ovitrap_alert_eggs: 100
ovitrap_radius_rings: 1
liraa_standard_min: 8100
liraa_standard_max: 12000
liraa_half_min: 2000
liraa_base_sample: 450
liraa_household_fraction: 0.2
# Q17: fração dos imóveis do quarteirão no modo half (manual 2013, p.13); a do
# standard é a liraa_household_fraction. O intervalo é round(1 ÷ fração).
liraa_half_household_fraction: 0.5
iip_bands: [1.0, 4.0]
