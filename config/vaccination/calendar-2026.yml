# Calendário Nacional de Vacinação 2026 (módulo 29, ADR 0047; Desvio 2). Curado sem o PDF lido linha a linha:
# TODA dose nasce `review: true`; a revisão de enfermagem é gate de go-live. Mudança de calendário = arquivo novo
# com versão; a cidade usa o vigente.
#
# IDADES por aritmética de calendário (Vaccination::Calendar::Age), nunca em dias corridos: `{ years:, months:, days: }`
# (qualquer combinação; ausentes = 0) somado ao nascimento com Date#advance (anos, depois meses, depois dias; 29/02
# + 1 ano = 28/02; 31/01 + 1 mês = 28 ou 29/02).
#  - `min_age` e `recommended_age`: a idade ATINGIDA — vale a partir de nascimento + idade.
#  - `max_age`: a idade COMPLETA, inclusiva — "até 4 anos" vale até 4 anos, 11 meses e 29 dias (a véspera de
#    nascimento + idade + 1 da menor unidade escrita: `{ years: 4 }` → véspera dos 5 anos; `{ months: 3, days: 15 }`
#    → o dia nascimento + 3 meses + 15 dias, inclusive).
#  - `age_window` (série): `{ min:, max: (null = sem teto), review:, source: }` — até que idade a série aparece para a
#    pessoa (regra de resgate); `null` quando a série é decidida pelas `age_bands` (influenza) ou pela gestação.
#  - `age_bands` (série): `{ <faixa>: <age_window> }`, a pessoa entra se estiver em alguma.
# INTERVALOS em dias (`min_interval_days`, `recommended_interval_days`, `repeat_every_days`), a partir da dose
# anterior da série; `pregnant_from_week` em semanas desde o início estimado da gestação.
version: "2026.1"
due_window_days: 30
source: "Calendário Nacional de Vacinação 2026 (PDFs por ciclo de vida, gov.br/saude, calendario-tecnico)"
