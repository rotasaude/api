# Kamal 2 — ambiente production
# Ver ADR-0001 (imagem única, papéis web e worker).
# Secrets vêm de `apps/api/deploy/production/secrets` (ver ADR-0013).
# Web em ≥2 hosts para tolerar queda de um nó; worker dedicado.

service: rota-saude-api
image: rota-saude/api

servers:
  web:
    hosts:
      - web1.rota-saude.example
      - web2.rota-saude.example
    options:
      memory: 1g
  worker:
    hosts:
      - worker1.rota-saude.example
    # Plano 5: um supervisor Solid Queue por cidade ativa, mais o da plataforma
    # (~6 processos por cidade). Só o worker cria e apaga banco de cidade (Plano 4):
    # o web nunca recebe a credencial de rota_provisioner. Backup e offboarding
    # rodam aqui (kamal app exec --roles=worker) e gravam em CITY_BACKUP_DIR.
    cmd: ./bin/city_workers
    env:
      clear:
        # Pool do banco ≥ maior número de threads de um worker em config/queue.yml + 2.
        RAILS_MAX_THREADS: "12"
      secret:
        - PROVISIONER_DATABASE_URL
    options:
      memory: 4g
      volume: /var/lib/rota-saude/city_backups:/rails/storage/city_backups

proxy:
  ssl: true
  # Plano 6: um host por papel do domínio. O curinga atende qualquer cidade
  # provisionada sem novo deploy — a aplicação resolve o slug pelo Host
  # (CityCatalog). `admin.` é o console e `auth.` é o callback único do gov.br.
  # O certificado curinga de *.rota-saude.example e o DNS são gate de go-live.
  #
  # Plano 8 (Task 10) — decidido: manter o curinga (opção 2 do README, "Hosts
  # publicados"), não trocar por lista de hosts explícita. Motivo: é o que
  # sustenta o self-service de provisionamento. Com `ssl: true` e o curinga
  # abaixo, o kamal-proxy tenta HTTP-01 para "*.rota-saude.example" a cada
  # deploy e o Let's Encrypt só emite curinga por DNS-01 — o deploy FALHA com
  # erro de ACME até isso ser resolvido. BLOQUEADO (dono: usuário), nesta
  # ordem, nenhum passo feito:
  #   1. emitir o certificado curinga por DNS-01 (fora do kamal-proxy) no
  #      provedor de DNS real;
  #   2. instalar esse certificado no kamal-proxy e desligar o ACME para
  #      estes hosts — a chave/flag exata não foi confirmada aqui: o Kamal não
  #      está instalado nesta máquina (ausente do Gemfile/Gemfile.lock, sem
  #      .kamal/, sem binário no PATH), então não há como consultar a versão
  #      em uso. Confirme contra a versão real antes de editar isto.
  # Ver README.md § "Hosts publicados (Plano 6)" para os dois caminhos e o
  # trade-off de cada um.
  hosts:
    - api.rota-saude.example
    - admin.rota-saude.example
    - auth.rota-saude.example
    - "*.rota-saude.example"
  app_port: 3000
  healthcheck:
    path: /up
    interval: 5

registry:
  server: ghcr.io
  username: rota-saude-bot
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ../..

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    WEB_CONCURRENCY: "2"
    RAILS_MAX_THREADS: "5"
    CITY_PUBLIC_BASE_TEMPLATE: "https://%{slug}.rota-saude.example"
    GOVBR_REDIRECT_URI: "https://auth.rota-saude.example/auth/govbr/callback"
    GOVBR_ISSUER_URL: "https://sso.acesso.gov.br"
    CITY_BACKUP_DIR: "/rails/storage/city_backups"
    ALLOWED_ORIGINS: "https://admin.rota-saude.example,https://auth.rota-saude.example"
    # Servidor das cidades provisionadas (cities.database_url). Não é secreto; o
    # web precisa dele no POST /cities, sem a credencial do provisioner.
    CITY_DATABASE_HOST: db.rota-saude.example
    CITY_DATABASE_PORT: "5432"
    # Plano 8 (Task 10). `require` cifra mas NÃO verifica a identidade do
    # servidor. Para `verify-full`, nesta ordem:
    #   1. emitir certificado para o host do Postgres (db.rota-saude.example) por
    #      uma CA que a imagem conheça (as do ca-certificates servem);
    #   2. configurar ssl_cert_file/ssl_key_file no acessório postgres;
    #   3. só então trocar a linha abaixo e fazer deploy.
    # Trocar ANTES do passo 2 derruba TODA conexão de cidade: a aplicação para.
    # BLOQUEADO (dono: usuário) nos passos 1 e 2: exigem acesso ao servidor e à
    # CA. NÃO trocar o valor abaixo até os dois estarem confirmados feitos.
    CITY_DATABASE_SSLMODE: "require"   # → "verify-full" depois dos passos acima
  secret:
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - CITY_UNSET_DATABASE_URL
    - GOVBR_CLIENT_ID
    - GOVBR_CLIENT_SECRET
    - PLATFORM_DATABASE_URL
    - RAILS_MASTER_KEY
    - ROTA_APP_PASSWORD
    - ROTA_PLATFORM_PASSWORD
    - WHATSAPP_APP_SECRET
    - WHATSAPP_VERIFY_TOKEN

accessories:
  postgres:
    image: postgres:16
    # Plano 8 (Task 10). Orçamento do README ("Worker por cidade" § conexões):
    # ~120 conexões de web (2 hosts × 2 Puma × 5 threads × pools) + ~80 por
    # cidade ativa de worker. O default do Postgres é 100, que não fecha nem
    # com duas cidades. 500 cobre ~4 cidades com folga; recalcule pelo README
    # antes de passar disso, e lembre que cada role de cidade já tem
    # CITY_ROLE_CONNECTION_LIMIT (default 100) como teto próprio — isso é o
    # teto do SERVIDOR, não substitui o teto por role.
    # BLOQUEADO (dono: usuário): a chave abaixo é `cmd:`, pelo único
    # precedente do próprio repositório (papel `worker`, deploy/*/deploy.yml —
    # ver o role `worker` acima), mas papel e acessório usam esquemas
    # diferentes no Kamal e o binário não está instalado nesta máquina para
    # confirmar. Confirme contra a versão de Kamal que roda o deploy antes de
    # aplicar — e aplicar exige reboot do acessório de qualquer forma.
    cmd: postgres -c max_connections=500
    host: db.rota-saude.example
    port: "127.0.0.1:5432:5432"
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_USER: rota_saude
        POSTGRES_DB: rota_saude_production
    directories:
      - data:/var/lib/postgresql/data

ssh:
  user: deploy
